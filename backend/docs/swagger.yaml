    CreateManualResultRequest:
      type: object
      description: >-
        Общее время задаётся одним из способов: либо elapsed_time_sec, либо пара
        started_at + finished_at (тогда общее время = финиш − старт). Все поля метрик опциональны.
      properties:
        elapsed_time_sec:
          type: integer
          minimum: 1
          description: Общее время в секундах. Требуется, если не заданы started_at и finished_at.
        moving_time_sec:
          type: integer
          minimum: 0
          description: Чистое время в секундах. Не может быть больше общего времени.
        started_at:
          type: string
          format: date-time
          description: Время старта (ISO 8601 / RFC3339, зона Минск UTC+3)
          example: "2025-06-15T09:06:14+03:00"
        finished_at:
          type: string
          format: date-time
          description: Время финиша (ISO 8601 / RFC3339, зона Минск UTC+3)
          example: "2025-06-15T23:38:30+03:00"
        distance_meters:
          type: integer
          minimum: 0
          description: Дистанция заезда в метрах (конвертация км↔м выполняется на фронтенде)
        avg_heart_rate:
          type: integer
          minimum: 0
          description: Средний пульс, уд/мин
        max_heart_rate:
          type: integer
          minimum: 0
          description: Максимальный пульс, уд/мин
        peak_speed_kmh:
          type: number
          format: double
          minimum: 0
          description: Пиковая скорость, км/ч
        avg_cadence:
          type: integer
          minimum: 0
          description: Средний каденс, об/мин
        calories:
          type: integer
          minimum: 0
          description: Калории, ккал
        result_link:
          type: string
          description: Опциональная ссылка на активность Strava
          example: https://www.strava.com/activities/123456789

    UpdateResultRequest:
      type: object
      description: >-
        Обновление результата — полная замена метрик (отсутствующее поле очищается).
        Общее время — через elapsed_time_sec либо пару started_at + finished_at.
      properties:
        elapsed_time_sec:
          type: integer
          minimum: 1
          description: Общее время в секундах. Требуется, если не заданы started_at и finished_at.
        moving_time_sec:
          type: integer
          minimum: 0
          description: Чистое время в секундах. Не может быть больше общего времени.
        started_at:
          type: string
          format: date-time
          description: Время старта (ISO 8601 / RFC3339, зона Минск UTC+3)
        finished_at:
          type: string
          format: date-time
          description: Время финиша (ISO 8601 / RFC3339, зона Минск UTC+3)
        distance_meters:
          type: integer
          minimum: 0
          description: Дистанция заезда в метрах
        avg_heart_rate:
          type: integer
          minimum: 0
          description: Средний пульс, уд/мин
        max_heart_rate:
          type: integer
          minimum: 0
          description: Максимальный пульс, уд/мин
        peak_speed_kmh:
          type: number
          format: double
          minimum: 0
          description: Пиковая скорость, км/ч
        avg_cadence:
          type: integer
          minimum: 0
          description: Средний каденс, об/мин
        calories:
          type: integer
          minimum: 0
          description: Калории, ккал

    Gift:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
          format: int64
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        event_id:
          type: integer
        description:
          type: string
        gender_filter:
          type: string
          enum: [all, male, female]
        bike_type_filter:
          type: string
          enum: [all, gravel, mtb, road, single_speed, tandem]
        review_status:
          type: string
          enum: [pending_review, approved]
          description: Статус проверки подарка администратором
        manual_distribution:
          type: boolean
          description: >-
            Приз исключён из автоматического распределения. Поля получателя здесь
            нет: оно доступно только в защищённом ManualGift read model.
        place:
          type: integer
          nullable: true
          description: Legacy compatibility field. Для rules типа places содержит первое место, для last_n или отсутствия правила не передаётся.
        place_rule:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/GiftPlaceRule'
        attachments:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              gift_id:
                type: integer
              telegram_file_id:
                type: string
              file_type:
                type: string
                enum: [photo, document]
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/Criteria'
        created_at:
          type: string
          format: date-time
        is_assigned:
          type: boolean

    CreateGiftRequest:
      type: object
      required:
        - user_id
        - description
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 1
          description: Telegram ID пользователя, от имени которого создаётся приз
        description:
          type: string
          minLength: 1
          description: Описание приза
        gender_filter:
          type: string
          enum: [all, male, female]
          default: all
        bike_type_filter:
          type: string
          enum: [all, gravel, mtb, road, single_speed, tandem]
          default: all

    GiftPlaceRule:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [places, last_n]
          description: "places задаёт явные места/диапазоны, last_n задаёт последние N участников eligible-группы."
        places:
          type: array
          description: Нормализованный список уникальных положительных мест. Используется только для type=places.
          items:
            type: integer
            minimum: 1
          example: [10, 11, 12, 13, 14, 15]
        last_count:
          type: integer
          minimum: 1
          description: Количество последних мест eligible-группы. Используется только для type=last_n.
          example: 5

    PrizeDistributionList:
      type: object
      properties:
        distribution:
          type: array
          items:
            $ref: '#/components/schemas/PrizeDistribution'
        unassigned_slots:
          type: array
          items:
            $ref: '#/components/schemas/UnassignedPrizeSlot'
        total:
          type: integer

    PrizeDistribution:
      type: object
      properties:
        participant_id:
          type: integer
        participant_name:
          type: string
        gender:
          type: string
        bike_type:
          type: string
        place_absolute:
          type: integer
        place_by_gender:
          type: integer
        place_by_gender_bike:
          type: integer
          description: Место в зачёте по гендеру и типу велосипеда.
        result_criteria:
          type: array
          items:
            $ref: '#/components/schemas/Criteria'
        matched_gifts:
          type: array
          description: Legacy compatibility list, populated from matched_gift_assignments during transition.
          items:
            $ref: '#/components/schemas/Gift'
        matched_gift_assignments:
          type: array
          items:
            $ref: '#/components/schemas/PrizeGiftAssignment'
        match_reason:
          type: string
          enum: [criteria, place, match, no_match]

    PrizeGiftAssignment:
      type: object
      properties:
        gift_id:
          type: integer
        gift:
          $ref: '#/components/schemas/Gift'
        rule_type:
          type: string
          enum: [none, places, last_n]
        target_rank:
          type: integer
          description: Целевой ранг внутри eligible-группы.
        assigned_rank:
          type: integer
          description: Фактический ранг участника внутри eligible-группы.
        is_fallback:
          type: boolean
        fallback_reason:
          type: string
        match_reason:
          type: string
          enum: [criteria, place, match]

    UnassignedPrizeSlot:
      type: object
      properties:
        gift_id:
          type: integer
        gift:
          $ref: '#/components/schemas/Gift'
        rule_type:
          type: string
          enum: [places, last_n]
        target_rank:
          type: integer
        reason:
          type: string
        fallback_reason:
          type: string

