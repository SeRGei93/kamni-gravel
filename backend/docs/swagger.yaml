# Gravel Bot API - OpenAPI 3.0 Specification
# 
# Для просмотра документации:
# 1. Запустите API сервер: make run-api
# 2. Откройте в браузере: http://localhost:8080/docs/
# 
# Или локально:
# cd backend/docs && python3 -m http.server 8000
# Откройте: http://localhost:8000

openapi: 3.0.3
info:
  title: Gravel Bot API
  description: |
    API для управления велосипедными гонками, участниками и призами.
    
    ## Аутентификация
    Защищённые эндпоинты требуют JWT токен в заголовке Authorization: Bearer <token>

    Telegram Mini App эндпоинты требуют заголовок X-Telegram-Init-Data.
    Значение должно приходить из Telegram.WebApp.initData и не должно храниться на клиенте.
    
    ## Роли
    - **admin** - полный доступ ко всем операциям
    - **viewer** - только чтение данных
    
    ## Быстрый старт
    1. Войдите через `/auth/login` (admin/admin123)
    2. Скопируйте `access_token` из ответа
    3. Нажмите "Authorize" вверху страницы и вставьте токен
    4. Теперь можете тестировать защищённые эндпоинты
  version: 1.0.0
  contact:
    name: Gravel Bot Support
    email: support@gravelbot.com

servers:
  - url: http://localhost:8080/api
    description: Development server
  - url: https://api.gravelbot.com/api
    description: Production server

tags:
  - name: Auth
    description: Аутентификация и авторизация
  - name: Admin Users
    description: Управление администраторами панели
  - name: Events
    description: Управление событиями (гонками)
  - name: Participants
    description: Управление участниками
  - name: User Blacklist
    description: Управление Telegram ID, которым запрещена регистрация и отправка подарков
  - name: Results
    description: Управление результатами участников
  - name: Gifts
    description: Управление подарками от спонсоров
  - name: Criteria
    description: Управление критериями для подарков
  - name: Prize Assignments
    description: Устаревшие маршруты назначения призов; не маршрутизируются и не должны использоваться.
  - name: Stats
    description: Статистика
  - name: Miniapp
    description: Telegram Mini App для просмотра проверенных подарков
  - name: Telegram
    description: Работа с файлами Telegram

paths:
  # ==================== AUTH ====================
  /auth/login:
    post:
      tags: [Auth]
      summary: Вход в систему
      description: Аутентификация администратора
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  example: admin123
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  expires_in:
                    type: integer
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      role:
                        type: string
                        enum: [admin, viewer]
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Обновление токена
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Новый access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer

  /auth/me:
    get:
      tags: [Auth]
      summary: Информация о текущем пользователе
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Данные пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'

  /auth/me/password:
    put:
      tags: [Auth]
      summary: Сменить пароль текущего администратора
      description: Проверяет текущий пароль и обновляет пароль администратора из JWT claims.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeAdminPasswordRequest'
      responses:
        '204':
          description: Пароль изменён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== ADMIN USERS ====================
  /admin-users:
    get:
      tags: [Admin Users]
      summary: Список администраторов
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список администраторов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Admin Users]
      summary: Создать администратора
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
      responses:
        '201':
          description: Администратор создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  # ==================== USER BLACKLIST ====================
  /user-blacklist:
    get:
      tags: [User Blacklist]
      summary: Список заблокированных Telegram ID
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список blacklist
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserBlacklistEntry'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [User Blacklist]
      summary: Добавить Telegram ID в blacklist
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBlacklistRequest'
      responses:
        '201':
          description: Запись создана или обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBlacklistEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user-blacklist/{telegramUserId}:
    put:
      tags: [User Blacklist]
      summary: Обновить причину блокировки
      security:
        - BearerAuth: []
      parameters:
        - name: telegramUserId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBlacklistReasonRequest'
      responses:
        '200':
          description: Запись обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBlacklistEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [User Blacklist]
      summary: Удалить Telegram ID из blacklist
      security:
        - BearerAuth: []
      parameters:
        - name: telegramUserId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Запись удалена
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== EVENTS ====================
  /events:
    get:
      tags: [Events]
      summary: Список всех событий
      parameters:
        - name: activeOnly
          in: query
          schema:
            type: boolean
          description: Фильтр по активным событиям
      responses:
        '200':
          description: Список событий
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  total:
                    type: integer

    post:
      tags: [Events]
      summary: Создать новое событие
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: kamni_200
                description:
                  type: string
                  example: КАМНИ 200 - гравийная гонка на 200 км
                participation_conditions:
                  type: string
                  example: УСЛОВИЯ УЧАСТИЯ (ДИСКЛЕЙМЕР) ‼️
                start_date:
                  type: string
                  format: date-time
                end_date:
                  type: string
                  format: date-time
                active:
                  type: boolean
                  default: true
                stop_results:
                  type: boolean
                  default: false
                stop_gifts:
                  type: boolean
                  default: false
                telegram_texts:
                  $ref: '#/components/schemas/EventTelegramTexts'
      responses:
        '201':
          description: Событие создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'

  /events/{id}:
    get:
      tags: [Events]
      summary: Получить событие по ID
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Данные события
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Events]
      summary: Обновить событие
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                participation_conditions:
                  type: string
                start_date:
                  type: string
                  format: date-time
                end_date:
                  type: string
                  format: date-time
                active:
                  type: boolean
                stop_results:
                  type: boolean
                stop_gifts:
                  type: boolean
                telegram_texts:
                  $ref: '#/components/schemas/EventTelegramTexts'
      responses:
        '200':
          description: Событие обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'

    delete:
      tags: [Events]
      summary: Удалить событие
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '204':
          description: Событие удалено

  /events/{id}/gpx-file:
    post:
      tags: [Events]
      summary: Загрузить GPX файл события
      description: Сохраняет GPX файл в общем файловом хранилище и обновляет gpx_file_path у события.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: GPX файл маршрута события
      responses:
        '200':
          description: Событие с обновлённым путём к GPX файлу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== PARTICIPANTS ====================
  /events/{eventId}/participants:
    get:
      tags: [Participants]
      summary: Список участников события
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: bike_type
          in: query
          schema:
            $ref: '#/components/schemas/BikeType'
        - name: gender
          in: query
          schema:
            $ref: '#/components/schemas/Gender'
        - name: criteria_id
          in: query
          description: Вернуть только участников, у которых критерий привязан к актуальному результату.
          schema:
            type: integer
            minimum: 1
        - name: sort
          in: query
          description: >-
            Колонка серверной сортировки (числовые/временные). Сортировка
            применяется ко всему отфильтрованному набору ДО пагинации;
            отсутствующие значения всегда уходят в конец. Неизвестный ключ
            игнорируется (порядок по умолчанию).
          schema:
            type: string
            enum:
              [
                place,
                place_absolute,
                place_by_gender,
                place_by_gender_bike,
                prizes_count,
                user_id,
                distance_km,
                calories,
                avg_heart_rate,
                max_heart_rate,
                avg_cadence,
                elapsed_time,
                moving_time,
                prev_elapsed_time,
                prev_elapsed_delta,
                idle_time,
                peak_speed_kmh,
                avg_speed_kmh,
                avg_moving_speed_kmh,
                peak_avg_speed_delta_kmh,
                started_at,
                ride_finished_at,
                ride_date,
              ]
        - name: order
          in: query
          description: Направление сортировки (по умолчанию asc). Действует только вместе с sort.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Список участников
          content:
            application/json:
              schema:
                type: object
                properties:
                  participants:
                    type: array
                    items:
                      $ref: '#/components/schemas/Participant'
                  total:
                    type: integer

    post:
      tags: [Participants]
      summary: Зарегистрировать участника
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, bike_type, gender]
              properties:
                user_id:
                  type: integer
                  format: int64
                  description: Telegram ID пользователя
                bike_type:
                  $ref: '#/components/schemas/BikeType'
                gender:
                  $ref: '#/components/schemas/Gender'
                notes:
                  type: string
      responses:
        '201':
          description: Участник зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'

  /participants/{id}:
    get:
      tags: [Participants]
      summary: Получить участника по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Данные участника
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'

    put:
      tags: [Participants]
      summary: Обновить данные участника
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bike_type:
                  $ref: '#/components/schemas/BikeType'
                gender:
                  $ref: '#/components/schemas/Gender'
                notes:
                  type: string
                status:
                  type: string
                  enum: [active, dnf, disqualified]
                prev_elapsed_time_sec:
                  type: integer
                  minimum: 0
                  description: >-
                    Ручное «время прошлого года» в секундах. Имеет приоритет над
                    значением, вычисленным по предыдущему событию. 0 — удалить
                    ручное значение (вернуться к вычисленному).
      responses:
        '200':
          description: Участник обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'

    delete:
      tags: [Participants]
      summary: Удалить участника
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Участник удалён

  # ==================== RESULTS ====================
  /participants/{participantId}/results:
    get:
      tags: [Results]
      summary: Список результатов участника
      parameters:
        - name: participantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Список результатов
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Result'
                  total:
                    type: integer

    post:
      tags: [Results]
      summary: Добавить результат участнику вручную
      description: Администратор добавляет обычный текущий результат из профиля участника. Общее время обязательно, ссылка Strava опциональна.
      security:
        - BearerAuth: []
      parameters:
        - name: participantId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManualResultRequest'
      responses:
        '201':
          description: Результат добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          description: Некорректные обязательные поля, время или ссылка результата.
        '404':
          description: Участник не найден
        '409':
          description: У участника уже есть текущий результат

  /results/{id}:
    get:
      tags: [Results]
      summary: Получить результат по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Данные результата
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

    put:
      tags: [Results]
      summary: Обновить результат (время и метрики заезда)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResultRequest'
      responses:
        '200':
          description: Результат обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

    delete:
      tags: [Results]
      summary: Удалить результат
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Результат удалён

  # ==================== GIFTS ====================
  /events/{eventId}/gifts:
    get:
      tags: [Gifts]
      summary: Список подарков события
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: review_status
          in: query
          schema:
            type: string
            enum: [pending_review, approved]
          description: Фильтр по статусу проверки. Если не передан, возвращаются все подарки события.
        - name: owner_user_id
          in: query
          schema:
            type: integer
          description: Telegram ID участника, который добавил приз.
        - name: q
          in: query
          schema:
            type: string
          description: Поиск по описанию приза, имени или username автора.
      responses:
        '200':
          description: Список подарков
          content:
            application/json:
              schema:
                type: object
                properties:
                  gifts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Gift'
                  total:
                    type: integer

    post:
      tags: [Gifts]
      summary: Добавить приз вручную
      description: Администратор создаёт обычный приз от имени Telegram-пользователя. Новый приз попадает в стандартный статус проверки.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGiftRequest'
      responses:
        '201':
          description: Приз создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gift'
        '400':
          description: Некорректные обязательные поля или фильтры
        '403':
          description: Telegram-пользователь находится в blacklist
        '404':
          description: Событие или Telegram-пользователь не найден

  /events/{eventId}/manual-gifts:
    get:
      tags: [Gifts]
      summary: Ручные подарки события с получателями
      description: >-
        Защищённый административный read model. Возвращает только подарки с
        manual_distribution=true и минимальные данные получателя; публичные
        Gift и Mini App catalog endpoints не раскрывают получателя.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Ручные подарки и выбранные получатели
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualGiftList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /gifts/{id}:
    get:
      tags: [Gifts]
      summary: Получить подарок по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Данные подарка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gift'

    put:
      tags: [Gifts]
      summary: Обновить подарок
      description: >-
        Обновляет поля подарка и, если передан `criteria_ids`, атомарно заменяет
        критерии. `manual_distribution` и `manual_recipient_participant_id`
        обрабатываются в той же атомарной операции. Получатель доступен только
        через защищённый manual-gifts read model, а не через публичный Gift DTO.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                gender_filter:
                  type: string
                  enum: [all, male, female]
                bike_type_filter:
                  type: string
                  enum: [all, gravel, mtb, road, single_speed, tandem]
                review_status:
                  type: string
                  enum: [pending_review, approved]
                place:
                  type: integer
                  nullable: true
                  description: Legacy-поле. Если place_rule не передан, значение мапится в single-place rule. Явный null очищает legacy place/rule, отсутствие поля сохраняет текущее значение.
                place_rule:
                  nullable: true
                  allOf:
                    - $ref: '#/components/schemas/GiftPlaceRule'
                  description: |
                    Новое правило мест. Отсутствие поля сохраняет текущее правило.
                    `null` очищает правило. Если одновременно переданы `place_rule` и legacy `place`, выигрывает `place_rule`.
                criteria_ids:
                  type: array
                  items:
                    type: integer
                manual_distribution:
                  type: boolean
                  description: >-
                    Отсутствующее поле сохраняет режим. true включает ручное
                    распределение; false отключает его и очищает получателя.
                manual_recipient_participant_id:
                  type: integer
                  nullable: true
                  description: >-
                    ID участника того же события. Отсутствие сохраняет значение,
                    null очищает получателя. Значение допустимо только в ручном режиме.
            examples:
              range:
                summary: Диапазон мест
                value:
                  place_rule:
                    type: places
                    places: [10, 11, 12, 13, 14, 15]
              last_n:
                summary: Последние пять мест eligible-группы
                value:
                  place_rule:
                    type: last_n
                    last_count: 5
              no_rule:
                summary: Без правила мест
                value:
                  place_rule: null
              manual_assignment:
                summary: Включить ручной режим и назначить получателя
                value:
                  manual_distribution: true
                  manual_recipient_participant_id: 42
      responses:
        '200':
          description: Подарок обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gift'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Подарок не в ручном режиме или получатель принадлежит другому событию

    delete:
      tags: [Gifts]
      summary: Удалить подарок
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Подарок удалён

  /events/{eventId}/prize-distribution:
    get:
      tags: [Gifts]
      summary: Автоматическое распределение подарков
      description: >-
        Возвращает только автоматическое распределение: строки участников,
        legacy matched_gifts, slot-level matched_gift_assignments и невыданные
        слоты правил. Подарки с manual_distribution=true и их получатели полностью исключены.
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Распределение подарков
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrizeDistributionList'

  # ==================== CRITERIA ====================
  /criteria:
    get:
      tags: [Criteria]
      summary: Список всех критериев
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/CriteriaType'
          description: Фильтр по типу критерия
      responses:
        '200':
          description: Список критериев
          content:
            application/json:
              schema:
                type: object
                properties:
                  criteria:
                    type: array
                    items:
                      $ref: '#/components/schemas/Criteria'
                  total:
                    type: integer

    post:
      tags: [Criteria]
      summary: Создать новый критерий
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, criteria_type]
              properties:
                name:
                  type: string
                  example: Максимальная скорость
                description:
                  type: string
                  example: Самая высокая зафиксированная скорость
                criteria_type:
                  $ref: '#/components/schemas/CriteriaType'
      responses:
        '201':
          description: Критерий создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Criteria'

  /criteria/{id}:
    get:
      tags: [Criteria]
      summary: Получить критерий по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Данные критерия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Criteria'

    put:
      tags: [Criteria]
      summary: Обновить критерий
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                criteria_type:
                  $ref: '#/components/schemas/CriteriaType'
      responses:
        '200':
          description: Критерий обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Criteria'

    delete:
      tags: [Criteria]
      summary: Удалить критерий
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Критерий удалён

  # ==================== PRIZE ASSIGNMENTS ====================
  /prize-assignments:
    post:
      tags: [Prize Assignments]
      summary: Назначить приз участнику
      deprecated: true
      description: >-
        Устаревший маршрут: не маршрутизируется, таблица prize_assignments
        удалена миграцией 00014. Используйте автоматическое или ручное распределение подарков.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participant_id, gift_id]
              properties:
                participant_id:
                  type: integer
                gift_id:
                  type: integer
                comment:
                  type: string
                  example: За первое место в абсолютном зачёте
      responses:
        '201':
          description: Приз назначен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrizeAssignment'

  /events/{eventId}/prize-assignments:
    get:
      tags: [Prize Assignments]
      summary: Список назначений призов для события
      deprecated: true
      description: Устаревший не маршрутизируемый маршрут; таблица удалена миграцией 00014.
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Список назначений
          content:
            application/json:
              schema:
                type: object
                properties:
                  prize_assignments:
                    type: array
                    items:
                      $ref: '#/components/schemas/PrizeAssignment'
                  total:
                    type: integer

  /participants/{participantId}/prize-assignments:
    get:
      tags: [Prize Assignments]
      summary: Список призов участника
      deprecated: true
      description: Устаревший не маршрутизируемый маршрут; таблица удалена миграцией 00014.
      parameters:
        - name: participantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Список призов
          content:
            application/json:
              schema:
                type: object
                properties:
                  prize_assignments:
                    type: array
                    items:
                      $ref: '#/components/schemas/PrizeAssignment'
                  total:
                    type: integer

  /prize-assignments/{id}:
    get:
      tags: [Prize Assignments]
      summary: Получить назначение приза по ID
      deprecated: true
      description: Устаревший не маршрутизируемый маршрут; таблица удалена миграцией 00014.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Данные назначения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrizeAssignment'

    delete:
      tags: [Prize Assignments]
      summary: Отменить назначение приза
      deprecated: true
      description: Устаревший не маршрутизируемый маршрут; таблица удалена миграцией 00014.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Назначение отменено

  # ==================== STATS ====================
  /stats:
    get:
      tags: [Stats]
      summary: Общая статистика
      responses:
        '200':
          description: Статистика по всем событиям
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_events:
                    type: integer
                  total_participants:
                    type: integer
                  total_gifts:
                    type: integer
                  total_assignments:
                    type: integer
                  participants_with_prizes_count:
                    type: integer

  /events/{eventId}/stats:
    get:
      tags: [Stats]
      summary: Статистика по событию
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Статистика события
          content:
            application/json:
              schema:
                type: object
                properties:
                  event_id:
                    type: integer
                  participants_count:
                    type: integer
                  gifts_count:
                    type: integer
                  assignments_count:
                    type: integer
                  participants_with_prizes_count:
                    type: integer
                  by_bike_type:
                    type: object
                  by_gender:
                    type: object

  # ==================== MINIAPP ====================
  /miniapp/session:
    get:
      tags: [Miniapp]
      summary: Сессия Telegram Mini App
      description: Возвращает валидированного Telegram-пользователя и активное событие. Требует X-Telegram-Init-Data из Telegram.WebApp.initData.
      security:
        - TelegramWebAppInitData: []
      responses:
        '200':
          description: Сессия miniapp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniappSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /miniapp/gifts:
    get:
      tags: [Miniapp]
      summary: Каталог проверенных подарков
      description: Возвращает только подарки со статусом approved для активного события. Требует X-Telegram-Init-Data из Telegram.WebApp.initData.
      security:
        - TelegramWebAppInitData: []
      parameters:
        - name: gender
          in: query
          schema:
            type: string
            enum: [all, male, female]
            default: all
          description: Выбранный зачёт участника; all означает абсолютный зачёт, male/female включает подарки абсолютного или совпадающего зачёта.
        - name: bike_type
          in: query
          schema:
            type: string
            enum: [all, gravel, mtb, road, single_speed, tandem]
            default: all
          description: Выбранный тип велосипеда; конкретный тип включает подарки с all или совпадающим фильтром.
      responses:
        '200':
          description: Каталог подарков
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /miniapp/leaderboard:
    get:
      tags: [Miniapp]
      summary: Лидерборд участников активного события
      description: >-
        Возвращает всех участников активного события с рассчитанным местом
        (финишировавшие в зачёте отсортированы по общему времени) и метриками
        заезда. Фильтрация по полу и типу велосипеда выполняется на клиенте.
        Требует X-Telegram-Init-Data из Telegram.WebApp.initData.
      security:
        - TelegramWebAppInitData: []
      responses:
        '200':
          description: Список участников лидерборда
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniappLeaderboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /miniapp/my-gifts:
    get:
      tags: [Miniapp]
      summary: Мои призы текущего Telegram-пользователя
      description: >-
        Возвращает все подарки, добавленные валидированным Telegram-пользователем
        для активного события, включая ожидающие проверки. Получатель содержит
        только безопасные поля и не включает Telegram user ID.
      security:
        - TelegramWebAppInitData: []
      responses:
        '200':
          description: Подарки владельца для активного события
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualGiftList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Нет активного события

  /miniapp/participants:
    get:
      tags: [Miniapp]
      summary: Варианты получателя для активного события
      description: >-
        Минимальный список всех участников активного события для выбора
        получателя. Не содержит Telegram user ID, заметок, дат регистрации,
        результатов или деталей о призах. Поле has_prize позволяет владельцу
        приза сначала выбрать участника без награды.
      security:
        - TelegramWebAppInitData: []
      responses:
        '200':
          description: Участники в детерминированном порядке отображения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniappParticipantOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Нет активного события

  /miniapp/my-gifts/{giftId}/recipient:
    put:
      tags: [Miniapp]
      summary: Назначить или очистить получателя ручного приза
      description: >-
        Владелец определяется исключительно из валидированного Telegram init data,
        а событие — на сервере. Чужой подарок возвращается как 404. Повторная
        запись того же значения идемпотентна.
      security:
        - TelegramWebAppInitData: []
      parameters:
        - name: giftId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participant_id]
              properties:
                participant_id:
                  type: integer
                  nullable: true
                  description: ID участника активного события; null очищает получателя.
            examples:
              assign:
                value: { participant_id: 42 }
              clear:
                value: { participant_id: null }
      responses:
        '204':
          description: Получатель сохранён или очищен
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Нет активного события, подарок недоступен владельцу или участник не найден
        '409':
          description: Подарок не в ручном режиме или участник принадлежит другому событию

  /miniapp/my-gifts/{giftId}/random-recipient:
    post:
      tags: [Miniapp]
      summary: Случайно назначить ручной приз участнику без награды
      description: >-
        Владелец и активное событие определяются на сервере из Telegram init data.
        Получатель случайно выбирается только среди участников, у которых нет
        автоматического или вручную назначенного приза.
      security:
        - TelegramWebAppInitData: []
      parameters:
        - name: giftId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Случайный получатель назначен
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Нет активного события или подарок недоступен владельцу
        '409':
          description: Подарок не ручной или не осталось участников без награды

  /miniapp/telegram/files/{fileId}:
    get:
      tags: [Miniapp]
      summary: Проксирование файла Telegram для miniapp
      description: Стримит содержимое Telegram-файла через backend, не раскрывая URL с BOT_TOKEN. Требует X-Telegram-Init-Data из Telegram.WebApp.initData.
      security:
        - TelegramWebAppInitData: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Содержимое файла
          content:
            image/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== TELEGRAM FILES ====================
  /telegram/files/{fileId}:
    get:
      tags: [Telegram]
      summary: Получить URL файла из Telegram
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: URL файла
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string

  /telegram/files/{fileId}/info:
    get:
      tags: [Telegram]
      summary: Получить информацию о файле
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Информация о файле
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_id:
                    type: string
                  file_size:
                    type: integer
                  file_path:
                    type: string
                  url:
                    type: string
                    description: Прямая ссылка на файл в Telegram

# ==================== COMPONENTS ====================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    TelegramWebAppInitData:
      type: apiKey
      in: header
      name: X-Telegram-Init-Data
      description: Значение Telegram.WebApp.initData из Telegram Mini App.

  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: integer
      description: ID события

  responses:
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Unauthorized

    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Not found

    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

    Conflict:
      description: Конфликт состояния ресурса
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

  schemas:
    AdminUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [admin, viewer]
        created_at:
          type: string
          format: date-time
        last_login:
          type: string
          format: date-time
          nullable: true

    AdminUserListResponse:
      type: object
      properties:
        admins:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        total:
          type: integer

    CreateAdminRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: new-admin
        password:
          type: string
          format: password
          minLength: 8

    ChangeAdminPasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8

    UserBlacklistEntry:
      type: object
      properties:
        telegram_user_id:
          type: integer
          format: int64
        reason:
          type: string
        username:
          type: string
          description: Telegram username, если пользователь уже существует
        first_name:
          type: string
        last_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserBlacklistRequest:
      type: object
      required: [telegram_user_id]
      properties:
        telegram_user_id:
          type: integer
          format: int64
          description: Telegram ID пользователя
        reason:
          type: string
          description: Причина блокировки

    UserBlacklistReasonRequest:
      type: object
      properties:
        reason:
          type: string
          description: Причина блокировки

    Event:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: kamni_200
        description:
          type: string
          example: КАМНИ 200 - гравийная гонка на 200 км
